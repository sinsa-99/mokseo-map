<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>금목서·은목서 지도</title>
<style>
  :root {
    --bg: #fffdf8; --fg: #2b2620; --muted: #7a7166; --line: #e8e0d2;
    --panel: rgba(255, 253, 248, 0.96); --shadow: 0 6px 24px rgba(60, 40, 10, 0.14);
    --gold: #e07b16; --silver: #f3f0e6; --silver-line: #8a8577; --unknown: #9aa0a6;
    --chip: #f4ede0; --chip-on: #2b2620; --chip-on-fg: #fffdf8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1a17; --fg: #f2ece2; --muted: #aaa094; --line: #3a352e;
      --panel: rgba(32, 29, 25, 0.96); --shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
      --chip: #2c2822; --chip-on: #f2ece2; --chip-on-fg: #1c1a17;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif; }
  #map { position: fixed; inset: 0; background: #ece8df; }

  .panel { position: fixed; z-index: 1000; top: 12px; left: 12px; width: 330px; max-height: calc(100% - 24px);
    overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); padding: 14px 16px; backdrop-filter: blur(6px); }
  h1 { font-size: 19px; margin: 0 0 2px; letter-spacing: -0.3px; }
  .sub { color: var(--muted); font-size: 12.5px; line-height: 1.5; margin: 0 0 10px; }
  .group { margin: 10px 0; }
  .group-title { font-size: 11.5px; color: var(--muted); margin-bottom: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--chip); color: var(--fg); font-size: 13px; cursor: pointer;
    user-select: none; font-family: inherit; }
  .chip[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-fg); border-color: var(--chip-on); }
  .chip .sw { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
  .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  button.act { font-family: inherit; font-size: 13px; padding: 7px 11px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--bg); color: var(--fg); cursor: pointer; }
  .shown { font-size: 12.5px; color: var(--muted); }
  .shown.error { color: #b3261e; }
  details { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
  summary { cursor: pointer; font-size: 13px; font-weight: 600; }
  .list { list-style: none; padding: 0; margin: 8px 0 0; }
  .list li { padding: 7px 4px; border-bottom: 1px dashed var(--line); cursor: pointer; font-size: 13px; }
  .list li:hover { background: var(--chip); }
  .list small { color: var(--muted); display: block; font-size: 11.5px; }
  .foot { font-size: 11px; color: var(--muted); line-height: 1.55; margin-top: 10px; }
  .foot a { color: inherit; }
  #toggle { display: none; }

  /* 범례 색 (마커 자체는 SVG 이미지로 그린다) */
  .chip .sw.sq { border-radius: 2px; }
  .chip .sw.sm { width: 8px; height: 8px; }
  .pulse-sw { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--gold); display: inline-block;
    box-shadow: 0 0 0 2px var(--chip), 0 0 0 3.5px var(--gold); }
  .sp-gold { background: var(--gold); }
  .sp-silver { background: var(--silver); border-color: var(--silver-line) !important; }
  .sp-both { background: linear-gradient(90deg, var(--gold) 50%, var(--silver) 50%); }
  .sp-unknown { background: var(--unknown); }
  .me { width: 16px; height: 16px; border-radius: 50%; background: #1a73e8; border: 3px solid #fff; box-shadow: 0 0 0 2px #1a73e8; }

  /* 팝업 (카카오 CustomOverlay) — 바탕은 항상 밝게 */
  .kpop { position: relative; width: 280px; max-width: calc(100vw - 32px); background: #fffdf8; color: #2b2620;
    border: 1px solid #e8e0d2; border-radius: 12px; box-shadow: 0 6px 24px rgba(60, 40, 10, .22);
    padding: 12px 14px; font-size: 13px; line-height: 1.5; margin-bottom: 16px; }
  .kpop::after { content: ""; position: absolute; left: 50%; bottom: -8px; width: 14px; height: 14px; background: #fffdf8;
    border-right: 1px solid #e8e0d2; border-bottom: 1px solid #e8e0d2; transform: translateX(-50%) rotate(45deg); }
  .kpop .close { position: absolute; top: 6px; right: 8px; border: 0; background: none; font-size: 20px; line-height: 1;
    cursor: pointer; color: #7a7166; padding: 2px 5px; font-family: inherit; }
  .pop h3 { margin: 0 22px 4px 0; font-size: 15px; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: #f4ede0; color: #5a4a35; margin-right: 4px; }
  .badge.gold { background: #fde3c4; color: #8a4a06; }
  .badge.silver { background: #eeece6; color: #55524a; }
  .pop q { display: block; margin: 6px 0; color: #5a5249; font-style: italic; font-size: 12.5px; }
  .pop .evidence-summary { margin: 6px 0; font-size: 12.5px; }
  .pop .location-note { margin: 6px 0; padding: 6px 8px; background: #f4ede0; color: #5a4a35; border-radius: 6px; font-size: 12px; }
  .pop img { width: 100%; max-height: 160px; object-fit: cover; border-radius: 8px; margin-top: 6px; }
  .pop .links a { margin-right: 8px; color: #1a5fb4; }
  .pop .meta { color: #7a7166; font-size: 12px; }

  @media (max-width: 640px) {
    .panel { top: auto; bottom: 0; left: 0; right: 0; width: auto; max-height: 62vh; border-radius: 16px 16px 0 0;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
    .panel.collapsed .body { display: none; }
    #toggle { display: inline-block; }
    h1 { font-size: 17px; }
  }
</style>
</head>
<body>
<div id="map" role="application" aria-label="금목서·은목서 위치 지도"></div>

<aside class="panel" id="panel">
  <div class="row">
    <h1>금목서·은목서 지도</h1>
    <button class="act" id="toggle" aria-expanded="true">접기</button>
  </div>
  <div class="body">
    <p class="sub">9월 말부터 10월 중순까지 꽃이 피어요. 향이 진해서 꽃보다 냄새로 먼저 알아챌 때가 많아요. <span id="built"></span></p>

    <div class="group">
      <div class="group-title">나무</div>
      <div class="chips" id="f-species">
        <button class="chip" data-v="금목서" aria-pressed="true"><span class="sw sp-gold"></span>금목서</button>
        <button class="chip" data-v="은목서" aria-pressed="true"><span class="sw sp-silver"></span>은목서</button>
        <button class="chip" data-v="목서" aria-pressed="true"><span class="sw sp-unknown"></span>목서 (금·은 미확인)</button>
      </div>
    </div>
    <div class="group">
      <div class="group-title">출처</div>
      <div class="chips" id="f-kind">
        <button class="chip" data-v="명소" aria-pressed="true"><span class="sw sp-gold"></span>명소·제보</button>
        <button class="chip" data-v="공공데이터" aria-pressed="true"><span class="sw sq sp-gold"></span>공공데이터</button>
        <button class="chip" data-v="관측기록" aria-pressed="true"><span class="sw sm sp-gold"></span>관측기록</button>
      </div>
    </div>
    <div class="group">
      <div class="chips">
        <button class="chip" id="f-recent" aria-pressed="false"><span class="pulse-sw"></span>지금 핀 곳만 (최근 7일)</button>
        <button class="chip" id="f-low" aria-pressed="false">신뢰도 낮음 숨기기</button>
      </div>
    </div>
    <div class="row" style="margin-top:10px">
      <span class="shown" id="shown">지도를 불러오는 중이에요…</span>
      <button class="act" id="locate">내 위치</button>
    </div>

    <details id="list-wrap">
      <summary>장소 목록</summary>
      <ul class="list" id="list"></ul>
    </details>

    <p class="foot">
      큰 동그라미는 명소·제보, 네모는 지자체 자료(가로수·공원·화단), 작은 점은 관측기록이에요. 점선 테두리는 신뢰도가 낮은 곳이에요.<br>
      금색 테두리가 한 겹 더 있는 점은 최근 7일 안에 꽃을 봤다는 기록이 있는 곳이에요. 네모는 나무가 심긴 곳이라 지금 꽃이 폈는지는 알 수 없어요.
    </p>
  </div>
</aside>

<!-- 카카오맵 JS SDK. 키는 카카오디벨로퍼스 앱 news-invest-map(ID 1633269)의 JavaScript 키로, 등록한 도메인(localhost:3000, sinsa-99.github.io, news-invest-web.vercel.app)에서만 동작한다.
     그래서 이 파일을 더블클릭(file://)으로 열면 지도가 안 뜬다. 폴더에서 python3 -m http.server 3000 을 띄우고 http://localhost:3000 으로 연다. -->
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=149c27c06537761dda9d589f7e383114&libraries=clusterer&autoload=false"></script>
<script src="data/places.js?v=d57bcb7dd1"></script>
<script>
(function () {
  const shownEl = document.getElementById('shown');
  const fail = msg => { shownEl.textContent = msg; shownEl.classList.add('error'); };
  const NO_SDK = '카카오 지도를 못 불러왔어요. 이 파일은 더블클릭(file://)으로는 안 열려요. 폴더에서 python3 -m http.server 3000 을 실행한 뒤 http://localhost:3000 으로 열거나, https://sinsa-99.github.io/mokseo-map/ 로 보세요.';
  if (!window.PLACES) {
    fail('데이터 파일(data/places.js)을 못 읽었습니다. scripts/build_data.py를 먼저 실행하세요.');
    throw new Error('PLACES missing');
  }
  if (!window.kakao || !kakao.maps || typeof kakao.maps.load !== 'function') {
    fail(NO_SDK);
    throw new Error('kakao maps sdk missing');
  }
  let started = false;
  const sdkTimer = setTimeout(() => { if (!started) fail(NO_SDK); }, 8000);
  kakao.maps.load(() => { started = true; clearTimeout(sdkTimer); init(); });

  const PLACES = window.PLACES, META = window.PLACES_META || {};
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const isDesktop = () => window.matchMedia('(min-width: 641px)').matches;
  const speciesTags = sp => sp === '금목서·은목서' ? ['금목서', '은목서'] : [sp];

  function popupHtml(p) {
    const tags = speciesTags(p.species).map(s => `<span class="badge ${s === '금목서' ? 'gold' : s === '은목서' ? 'silver' : ''}">${esc(s)}</span>`).join('');
    // 카카오맵 검색·장소 페이지는 위치를 확인한 링크라 '출처'와 따로 '위치 확인'으로 단다
    const all = p.urls && p.urls.length ? p.urls : (p.url ? [p.url] : []);
    const isLoc = u => /^https?:\/\/(place\.)?map\.kakao\.com\//.test(u);
    const label = (arr, i, name) => name + (arr.length > 1 ? ' ' + (i + 1) : '');
    const src = all.filter(u => !isLoc(u)), loc = all.filter(isLoc);
    const links = src.map((u, i) => `<a href="${esc(u)}" target="_blank" rel="noopener">${label(src, i, '출처')}</a>`).join('')
      + loc.map((u, i) => `<a href="${esc(u)}" target="_blank" rel="noopener">${label(loc, i, '위치 확인')}</a>`).join('');
    const nm = encodeURIComponent(p.name);
    return `<div class="pop">
      <h3>${esc(p.name)}</h3>
      <div>${tags}<span class="badge">${esc(p.kind)}</span><span class="badge">신뢰도 ${esc(p.confidence)}</span>${p.historical ? '<span class="badge">과거 관찰</span>' : ''}${p.recent ? '<span class="badge gold">최근 7일</span>' : ''}</div>
      ${p.address ? `<div class="meta">${esc(p.address)}</div>` : ''}
      ${p.coordinateNote ? `<div class="location-note">${esc(p.coordinateNote)}${p.historical ? '<br>과거 기록이며 현재 개화·존재 여부는 미확인입니다.' : ''}</div>` : ''}
      ${p.speciesNote ? `<div class="meta">${esc(p.speciesNote)}</div>` : ''}
      ${p.evidence ? (p.evidenceIsSummary ? `<p class="evidence-summary">${esc(p.evidence)}</p>` : `<q>${esc(p.evidence)}</q>`) : ''}
      <div class="meta">${esc(p.source)}${p.date ? ' · ' + (p.dateLabel ? esc(p.dateLabel) + ' ' : '') + esc(p.date) : ''}${p.count > 1 ? ` · 이 자리 기록 ${p.count}건` : ''}${p.taxon ? ` · <i>${esc(p.taxon)}</i>` : ''}</div>
      <div class="links">${links}
        <a href="https://map.kakao.com/link/map/${nm},${p.lat},${p.lng}" target="_blank" rel="noopener">카카오맵</a>
        <a href="https://map.kakao.com/link/to/${nm},${p.lat},${p.lng}" target="_blank" rel="noopener">길찾기</a></div>
      ${p.photo ? `<img src="${esc(p.photo)}" alt="${esc(p.name)} 관측 사진" loading="lazy">` : ''}
    </div>`;
  }

  // 마커 이미지: 종(색) × 출처(모양·크기) × 신뢰도(점선) × 최근 개화(금색 겉테두리) 조합마다 SVG 하나를 만들어 재사용한다.
  const COLOR = { gold: '#e07b16', silver: '#f3f0e6', silverLine: '#8a8577', unknown: '#9aa0a6' };
  const imgCache = new Map();
  function markerImage(p) {
    const big = p.kind === '명소', pub = p.kind === '공공데이터';
    const s = big ? 18 : pub ? 14 : 11;
    const sp = p.species === '금목서' ? 'gold' : p.species === '은목서' ? 'silver' : p.species === '금목서·은목서' ? 'both' : 'unknown';
    const low = p.confidence === '하', recent = !!p.recent;
    const key = [s, pub ? 'sq' : 'ci', sp, low, recent].join('|');
    if (imgCache.has(key)) return imgCache.get(key);
    const pad = recent ? 6 : 2, W = s + pad * 2, c = W / 2, r = s / 2;
    const sw = big || pub ? 2 : 1.5;
    const stroke = sp === 'silver' ? COLOR.silverLine : '#fff';
    const dash = low ? ' stroke-dasharray="3 2"' : '';
    const fill = sp === 'gold' ? COLOR.gold : sp === 'silver' ? COLOR.silver : sp === 'unknown' ? COLOR.unknown : 'url(#g)';
    const defs = sp === 'both' ? `<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="50%" stop-color="${COLOR.gold}"/><stop offset="50%" stop-color="${COLOR.silver}"/></linearGradient></defs>` : '';
    const shadow = pub
      ? `<rect x="${c - r}" y="${c - r + 1}" width="${s}" height="${s}" rx="3" fill="rgba(0,0,0,.28)"/>`
      : `<circle cx="${c}" cy="${c + 1}" r="${r}" fill="rgba(0,0,0,.28)"/>`;
    const body = pub
      ? `<rect x="${c - r + sw / 2}" y="${c - r + sw / 2}" width="${s - sw}" height="${s - sw}" rx="3" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"${dash}/>`
      : `<circle cx="${c}" cy="${c}" r="${r - sw / 2}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"${dash}/>`;
    const ring = recent ? `<circle cx="${c}" cy="${c}" r="${r + 4}" fill="none" stroke="${COLOR.gold}" stroke-width="2"/>` : '';
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${W}" viewBox="0 0 ${W} ${W}">${defs}${shadow}${body}${ring}</svg>`;
    const img = new kakao.maps.MarkerImage('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg),
      new kakao.maps.Size(W, W), { offset: new kakao.maps.Point(c, c), alt: '' });
    imgCache.set(key, img);
    return img;
  }

  const clusterStyle = s => ({
    width: s + 'px', height: s + 'px', lineHeight: (s - 6) + 'px', boxSizing: 'border-box',
    background: 'rgba(224, 123, 22, .88)', color: '#fff', borderRadius: '50%', textAlign: 'center',
    fontWeight: '700', fontSize: '13px', border: '3px solid rgba(255,255,255,.85)', boxShadow: '0 2px 8px rgba(0,0,0,.3)',
    fontFamily: 'inherit'
  });

  function init() {
    const mapEl = document.getElementById('map');
    const map = new kakao.maps.Map(mapEl, { center: new kakao.maps.LatLng(35.9, 127.8), level: 13 });
    map.addControl(new kakao.maps.MapTypeControl(), kakao.maps.ControlPosition.TOPRIGHT);
    map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
    // 남한 전체가 보이게. 데스크톱은 왼쪽 패널(330px) 만큼, 폰은 아래 패널 만큼 비워 둔다.
    map.setBounds(new kakao.maps.LatLngBounds(new kakao.maps.LatLng(33.1, 125.9), new kakao.maps.LatLng(38.4, 129.7)),
      12, 12, isDesktop() ? 12 : 90, isDesktop() ? 354 : 12);

    // 레벨 7 이상(넓게 볼 때)에서만 묶는다. 레벨 6 이하에서는 점 하나하나가 보인다.
    const CLUSTER_MIN_LEVEL = 7;
    const clusterer = new kakao.maps.MarkerClusterer({
      map, averageCenter: true, minLevel: CLUSTER_MIN_LEVEL, gridSize: 45, minClusterSize: 2,
      calculator: [10, 50], styles: [clusterStyle(30), clusterStyle(38), clusterStyle(46)]
    });

    const today = new Date(); today.setHours(0, 0, 0, 0);
    const DAY = 86400000;
    PLACES.forEach(p => {
      const d = p.date && /^\d{4}-\d{2}-\d{2}/.test(p.date) ? new Date(p.date.slice(0, 10) + 'T00:00:00') : null;
      // 최근 7일 안에 '핀 것을 본' 기록만: 관측기록, 제보, 또는 올해 개화를 적은 블로그 글
      const seen = p.kind === '관측기록' || p.bloomSeen;
      p.recent = seen && !!d && (today - d) / DAY <= 7 && (today - d) >= 0;
    });

    // 팝업: CustomOverlay 하나를 열고 닫는다.
    let popup = null;
    function closePopup() { if (popup) { popup.setMap(null); popup = null; } }
    function openPopup(p) {
      closePopup();
      const el = document.createElement('div');
      el.className = 'kpop';
      el.innerHTML = `<button class="close" type="button" aria-label="닫기">×</button>` + popupHtml(p);
      el.querySelector('.close').addEventListener('click', closePopup);
      const pos = new kakao.maps.LatLng(p.lat, p.lng);
      popup = new kakao.maps.CustomOverlay({ map, position: pos, content: el, xAnchor: 0.5, yAnchor: 1, zIndex: 10000, clickable: true });
      // 팝업이 패널이나 화면 밖에 가리면 그만큼 지도를 민다 (Leaflet autoPan 대신).
      requestAnimationFrame(() => {
        const r = el.getBoundingClientRect(), m = mapEl.getBoundingClientRect();
        const padL = isDesktop() ? 354 : 12, padB = isDesktop() ? 12 : 90, padT = 12, padR = 12;
        let dx = 0, dy = 0;
        if (r.left < m.left + padL) dx = r.left - (m.left + padL);
        else if (r.right > m.right - padR) dx = r.right - (m.right - padR);
        if (r.top < m.top + padT) dy = r.top - (m.top + padT);
        else if (r.bottom > m.bottom - padB) dy = r.bottom - (m.bottom - padB);
        if (dx || dy) map.panBy(dx, dy);
      });
    }
    kakao.maps.event.addListener(map, 'click', closePopup);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closePopup(); });

    const markers = PLACES.map((p, i) => {
      const big = p.kind === '명소', pub = p.kind === '공공데이터';
      const m = new kakao.maps.Marker({
        position: new kakao.maps.LatLng(p.lat, p.lng), image: markerImage(p), title: p.name, clickable: true,
        zIndex: p.recent ? 900 : big ? 500 : pub ? 300 : 0, opacity: big || pub ? 1 : 0.85
      });
      kakao.maps.event.addListener(m, 'click', () => openPopup(p));
      m._p = p; m._i = i;
      return m;
    });

    const state = { species: new Set(['금목서', '은목서', '목서']), kind: new Set(['명소', '공공데이터', '관측기록']), hideLow: false, recentOnly: false };
    const visible = p => speciesTags(p.species).some(s => state.species.has(s)) && state.kind.has(p.kind)
      && !(state.hideLow && p.confidence === '하') && !(state.recentOnly && !p.recent);

    function render() {
      closePopup();
      clusterer.clear();
      const shown = markers.filter(m => visible(m._p));
      clusterer.addMarkers(shown);
      const nRecent = shown.filter(m => m._p.recent).length;
      shownEl.classList.remove('error');
      shownEl.textContent = `지도에 ${shown.length}곳이 보여요` + (nRecent ? ` · 최근 7일 안에 핀 곳 ${nRecent}곳` : '');
      const list = document.getElementById('list');
      const spots = shown.filter(m => m._p.kind !== '관측기록').sort((a, b) => (a._p.address || '').localeCompare(b._p.address || '', 'ko'));
      list.innerHTML = spots.map(m => `<li data-i="${m._i}">${esc(m._p.name)} <span class="badge ${m._p.species === '금목서' ? 'gold' : m._p.species === '은목서' ? 'silver' : ''}">${esc(m._p.species)}</span>${m._p.historical ? '<span class="badge">과거 관찰</span>' : ''}<small>${esc(m._p.address)}</small></li>`).join('')
        || '<li>보이는 장소가 없어요.</li>';
    }

    function bindChips(id, key) {
      document.querySelectorAll(`#${id} .chip`).forEach(b => b.addEventListener('click', () => {
        const on = b.getAttribute('aria-pressed') !== 'true';
        b.setAttribute('aria-pressed', on);
        on ? state[key].add(b.dataset.v) : state[key].delete(b.dataset.v);
        render();
      }));
    }
    bindChips('f-species', 'species');
    bindChips('f-kind', 'kind');
    document.getElementById('f-recent').addEventListener('click', e => {
      state.recentOnly = !state.recentOnly; e.currentTarget.setAttribute('aria-pressed', state.recentOnly); render();
    });
    document.getElementById('f-low').addEventListener('click', e => {
      state.hideLow = !state.hideLow; e.currentTarget.setAttribute('aria-pressed', state.hideLow); render();
    });

    document.getElementById('list').addEventListener('click', e => {
      const li = e.target.closest('li[data-i]'); if (!li) return;
      const p = markers[+li.dataset.i]._p;
      // 묶음이 풀리는 레벨까지 들어가서 그 자리로 옮긴 뒤 팝업을 연다 (Leaflet zoomToShowLayer 대신).
      if (map.getLevel() >= CLUSTER_MIN_LEVEL) map.setLevel(CLUSTER_MIN_LEVEL - 1);
      map.setCenter(new kakao.maps.LatLng(p.lat, p.lng));
      if (window.matchMedia('(max-width: 640px)').matches) setCollapsed(true);
      openPopup(p);
    });

    let meOverlay = null;
    document.getElementById('locate').addEventListener('click', () => {
      if (!navigator.geolocation) { alert('이 브라우저에서는 위치를 쓸 수 없어요.'); return; }
      navigator.geolocation.getCurrentPosition(pos => {
        const ll = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
        if (meOverlay) meOverlay.setMap(null);
        const dot = document.createElement('div'); dot.className = 'me'; dot.title = '내 위치';
        meOverlay = new kakao.maps.CustomOverlay({ map, position: ll, content: dot, xAnchor: 0.5, yAnchor: 0.5, zIndex: 5000 });
        map.setLevel(8);
        map.setCenter(ll);
      }, err => alert('위치를 가져오지 못했어요. 휴대폰 설정에서 위치 권한을 확인해 주세요.'), { enableHighAccuracy: true, timeout: 10000 });
    });

    render();
  }

  const panel = document.getElementById('panel'), toggle = document.getElementById('toggle');
  function setCollapsed(c) { panel.classList.toggle('collapsed', c); toggle.textContent = c ? '펼치기' : '접기'; toggle.setAttribute('aria-expanded', !c); }
  toggle.addEventListener('click', () => setCollapsed(!panel.classList.contains('collapsed')));

  if (META.built) {
    const [y, mo, d] = META.built.split('-').map(Number);
    document.getElementById('built').textContent = `${y}년 ${mo}월 ${d}일 기준이에요.`;
  }
  if (window.matchMedia('(max-width: 640px)').matches) setCollapsed(true);
})();
</script>
</body>
</html>
