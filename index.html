<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>금목서·은목서 지도</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<style>
  :root {
    --bg: #fffdf8; --fg: #2b2620; --muted: #7a7166; --line: #e8e0d2;
    --panel: rgba(255, 253, 248, 0.96); --shadow: 0 6px 24px rgba(60, 40, 10, 0.14);
    --gold: #e07b16; --silver: #f3f0e6; --silver-line: #8a8577; --unknown: #9aa0a6;
    --chip: #f4ede0; --chip-on: #2b2620; --chip-on-fg: #fffdf8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1a17; --fg: #f2ece2; --muted: #aaa094; --line: #3a352e;
      --panel: rgba(32, 29, 25, 0.96); --shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
      --chip: #2c2822; --chip-on: #f2ece2; --chip-on-fg: #1c1a17;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif; }
  #map { position: fixed; inset: 0; }

  .panel { position: fixed; z-index: 1000; top: 12px; left: 12px; width: 330px; max-height: calc(100% - 24px);
    overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); padding: 14px 16px; backdrop-filter: blur(6px); }
  h1 { font-size: 19px; margin: 0 0 2px; letter-spacing: -0.3px; }
  .sub { color: var(--muted); font-size: 12.5px; line-height: 1.5; margin: 0 0 10px; }
  .group { margin: 10px 0; }
  .group-title { font-size: 11.5px; color: var(--muted); margin-bottom: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--chip); color: var(--fg); font-size: 13px; cursor: pointer;
    user-select: none; font-family: inherit; }
  .chip[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-fg); border-color: var(--chip-on); }
  .chip .sw { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
  .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  button.act { font-family: inherit; font-size: 13px; padding: 7px 11px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--bg); color: var(--fg); cursor: pointer; }
  .shown { font-size: 12.5px; color: var(--muted); }
  details { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
  summary { cursor: pointer; font-size: 13px; font-weight: 600; }
  .list { list-style: none; padding: 0; margin: 8px 0 0; }
  .list li { padding: 7px 4px; border-bottom: 1px dashed var(--line); cursor: pointer; font-size: 13px; }
  .list li:hover { background: var(--chip); }
  .list small { color: var(--muted); display: block; font-size: 11.5px; }
  .foot { font-size: 11px; color: var(--muted); line-height: 1.55; margin-top: 10px; }
  .foot a { color: inherit; }
  #toggle { display: none; }

  /* 마커 */
  .dot { border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
  .dot.obs { border-width: 1.5px; opacity: .85; }
  .dot.low { border-style: dashed; }
  .dot.pub { border-radius: 3px; }
  .chip .sw.sq { border-radius: 2px; }
  .chip .sw.sm { width: 8px; height: 8px; }
  .recent-wrap { position: relative; }
  .recent-wrap::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--gold);
    animation: pulse 1.8s ease-out infinite; pointer-events: none; }
  .pulse-sw { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--gold); display: inline-block; }
  @keyframes pulse { from { transform: scale(.7); opacity: .9; } to { transform: scale(1.6); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .recent-wrap::after { animation: none; opacity: .8; } }
  .sp-gold { background: var(--gold); }
  .sp-silver { background: var(--silver); border-color: var(--silver-line) !important; }
  .sp-both { background: linear-gradient(90deg, var(--gold) 50%, var(--silver) 50%); }
  .sp-unknown { background: var(--unknown); }
  .cluster { background: rgba(224, 123, 22, .88); color: #fff; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-weight: 700; font-size: 13px; border: 3px solid rgba(255,255,255,.85);
    box-shadow: 0 2px 8px rgba(0,0,0,.3); }

  /* 팝업 */
  .leaflet-popup-content { margin: 12px 14px; font-size: 13px; line-height: 1.5; min-width: 220px; }
  .pop h3 { margin: 0 0 4px; font-size: 15px; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: #f4ede0; color: #5a4a35; margin-right: 4px; }
  .badge.gold { background: #fde3c4; color: #8a4a06; }
  .badge.silver { background: #eeece6; color: #55524a; }
  .pop q { display: block; margin: 6px 0; color: #5a5249; font-style: italic; font-size: 12.5px; }
  .pop .evidence-summary { margin: 6px 0; font-size: 12.5px; }
  .pop .location-note { margin: 6px 0; padding: 6px 8px; background: #f4ede0; color: #5a4a35; border-radius: 6px; font-size: 12px; }
  .pop img { width: 100%; max-height: 160px; object-fit: cover; border-radius: 8px; margin-top: 6px; }
  .pop .links a { margin-right: 8px; }
  .pop .meta { color: #7a7166; font-size: 12px; }

  @media (max-width: 640px) {
    .panel { top: auto; bottom: 0; left: 0; right: 0; width: auto; max-height: 62vh; border-radius: 16px 16px 0 0;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
    .panel.collapsed .body { display: none; }
    #toggle { display: inline-block; }
    h1 { font-size: 17px; }
  }
</style>
</head>
<body>
<div id="map" role="application" aria-label="금목서·은목서 위치 지도"></div>

<aside class="panel" id="panel">
  <div class="row">
    <h1>금목서·은목서 지도</h1>
    <button class="act" id="toggle" aria-expanded="true">접기</button>
  </div>
  <div class="body">
    <p class="sub">9월 말부터 10월 중순까지 꽃이 피어요. 향이 진해서 꽃보다 냄새로 먼저 알아챌 때가 많아요. <span id="built"></span></p>

    <div class="group">
      <div class="group-title">나무</div>
      <div class="chips" id="f-species">
        <button class="chip" data-v="금목서" aria-pressed="true"><span class="sw sp-gold"></span>금목서</button>
        <button class="chip" data-v="은목서" aria-pressed="true"><span class="sw sp-silver"></span>은목서</button>
        <button class="chip" data-v="목서" aria-pressed="true"><span class="sw sp-unknown"></span>목서 (금·은 미확인)</button>
      </div>
    </div>
    <div class="group">
      <div class="group-title">출처</div>
      <div class="chips" id="f-kind">
        <button class="chip" data-v="명소" aria-pressed="true"><span class="sw sp-gold"></span>명소·제보</button>
        <button class="chip" data-v="공공데이터" aria-pressed="true"><span class="sw sq sp-gold"></span>공공데이터</button>
        <button class="chip" data-v="관측기록" aria-pressed="true"><span class="sw sm sp-gold"></span>관측기록</button>
      </div>
    </div>
    <div class="group">
      <div class="chips">
        <button class="chip" id="f-recent" aria-pressed="false"><span class="pulse-sw"></span>지금 핀 곳만 (최근 7일)</button>
        <button class="chip" id="f-low" aria-pressed="false">신뢰도 낮음 숨기기</button>
      </div>
    </div>
    <div class="row" style="margin-top:10px">
      <span class="shown" id="shown"></span>
      <button class="act" id="locate">내 위치</button>
    </div>

    <details id="list-wrap">
      <summary>장소 목록</summary>
      <ul class="list" id="list"></ul>
    </details>

    <p class="foot">
      큰 동그라미는 명소·제보, 네모는 지자체 자료(가로수·공원·화단), 작은 점은 관측기록이에요. 점선 테두리는 신뢰도가 낮은 곳이에요.<br>
      테두리가 퍼지는 점은 최근 7일 안에 꽃을 봤다는 기록이 있는 곳이에요. 네모는 나무가 심긴 곳이라 지금 꽃이 폈는지는 알 수 없어요.
    </p>
  </div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script src="data/places.js?v=d57bcb7dd1"></script>
<script>
(function () {
  if (!window.PLACES) {
    document.getElementById('shown').textContent = '데이터 파일(data/places.js)을 못 읽었습니다. scripts/build_data.py를 먼저 실행하세요.';
    throw new Error('PLACES missing');
  }
  const PLACES = window.PLACES, META = window.PLACES_META || {};
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const map = L.map('map', { zoomControl: false, preferCanvas: false }).setView([35.6, 127.9], 7);
  L.control.zoom({ position: 'topright' }).addTo(map);
  // 파일을 더블클릭으로 열면(file://) 브라우저가 Referer를 안 보내서 tile.openstreetmap.org는 403 'Access blocked'를 준다.
  // Referer 없이도 되는 OSM 미러를 기본으로 두고, 막히면 오른쪽 위에서 바꿀 수 있게 한다.
  const OSM_ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
  const bases = {
    '기본 (OSM 프랑스 HOT)': L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
      maxZoom: 19, subdomains: 'abc', attribution: OSM_ATTR + ', 타일 <a href="https://www.openstreetmap.fr/" target="_blank" rel="noopener">OSM France</a>' }),
    'OSM 독일': L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png', {
      maxZoom: 18, attribution: OSM_ATTR + ', 타일 openstreetmap.de' }),
    'OSM 표준 (서버로 열 때만)': L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: OSM_ATTR })
  };
  bases['기본 (OSM 프랑스 HOT)'].addTo(map);
  L.control.layers(bases, null, { position: 'topright', collapsed: true }).addTo(map);

  const cluster = L.markerClusterGroup({
    disableClusteringAtZoom: 13, maxClusterRadius: 45, showCoverageOnHover: false,
    iconCreateFunction: c => {
      const n = c.getChildCount(), s = n < 10 ? 30 : n < 50 ? 38 : 46;
      return L.divIcon({ html: `<div class="cluster" style="width:${s}px;height:${s}px">${n}</div>`, className: '', iconSize: [s, s] });
    }
  }).addTo(map);

  const spClass = sp => sp === '금목서' ? 'sp-gold' : sp === '은목서' ? 'sp-silver' : sp === '금목서·은목서' ? 'sp-both' : 'sp-unknown';
  const speciesTags = sp => sp === '금목서·은목서' ? ['금목서', '은목서'] : [sp];

  function popupHtml(p) {
    const tags = speciesTags(p.species).map(s => `<span class="badge ${s === '금목서' ? 'gold' : s === '은목서' ? 'silver' : ''}">${esc(s)}</span>`).join('');
    // 카카오맵 검색·장소 페이지는 위치를 확인한 링크라 '출처'와 따로 '위치 확인'으로 단다
    const all = p.urls && p.urls.length ? p.urls : (p.url ? [p.url] : []);
    const isLoc = u => /^https?:\/\/(place\.)?map\.kakao\.com\//.test(u);
    const label = (arr, i, name) => name + (arr.length > 1 ? ' ' + (i + 1) : '');
    const src = all.filter(u => !isLoc(u)), loc = all.filter(isLoc);
    const links = src.map((u, i) => `<a href="${esc(u)}" target="_blank" rel="noopener">${label(src, i, '출처')}</a>`).join('')
      + loc.map((u, i) => `<a href="${esc(u)}" target="_blank" rel="noopener">${label(loc, i, '위치 확인')}</a>`).join('');
    const nm = encodeURIComponent(p.name);
    return `<div class="pop">
      <h3>${esc(p.name)}</h3>
      <div>${tags}<span class="badge">${esc(p.kind)}</span><span class="badge">신뢰도 ${esc(p.confidence)}</span>${p.historical ? '<span class="badge">과거 관찰</span>' : ''}${p.recent ? '<span class="badge gold">최근 7일</span>' : ''}</div>
      ${p.address ? `<div class="meta">${esc(p.address)}</div>` : ''}
      ${p.coordinateNote ? `<div class="location-note">${esc(p.coordinateNote)}${p.historical ? '<br>과거 기록이며 현재 개화·존재 여부는 미확인입니다.' : ''}</div>` : ''}
      ${p.speciesNote ? `<div class="meta">${esc(p.speciesNote)}</div>` : ''}
      ${p.evidence ? (p.evidenceIsSummary ? `<p class="evidence-summary">${esc(p.evidence)}</p>` : `<q>${esc(p.evidence)}</q>`) : ''}
      <div class="meta">${esc(p.source)}${p.date ? ' · ' + (p.dateLabel ? esc(p.dateLabel) + ' ' : '') + esc(p.date) : ''}${p.count > 1 ? ` · 이 자리 기록 ${p.count}건` : ''}${p.taxon ? ` · <i>${esc(p.taxon)}</i>` : ''}</div>
      <div class="links">${links}
        <a href="https://map.kakao.com/link/map/${nm},${p.lat},${p.lng}" target="_blank" rel="noopener">카카오맵</a>
        <a href="https://map.kakao.com/link/to/${nm},${p.lat},${p.lng}" target="_blank" rel="noopener">길찾기</a></div>
      ${p.photo ? `<img src="${esc(p.photo)}" alt="${esc(p.name)} 관측 사진" loading="lazy">` : ''}
    </div>`;
  }

  const today = new Date(); today.setHours(0, 0, 0, 0);
  const DAY = 86400000;
  PLACES.forEach(p => {
    const d = p.date && /^\d{4}-\d{2}-\d{2}/.test(p.date) ? new Date(p.date.slice(0, 10) + 'T00:00:00') : null;
    // 최근 7일 안에 '핀 것을 본' 기록만: 관측기록, 제보, 또는 올해 개화를 적은 블로그 글
    const seen = p.kind === '관측기록' || p.bloomSeen;
    p.recent = seen && !!d && (today - d) / DAY <= 7 && (today - d) >= 0;
  });
  const markers = PLACES.map(p => {
    const big = p.kind === '명소', pub = p.kind === '공공데이터', s = big ? 18 : pub ? 14 : 11;
    const icon = L.divIcon({
      className: '', iconSize: [s, s],
      html: `<div class="${p.recent ? 'recent-wrap' : ''}" style="width:${s}px;height:${s}px"><div class="dot ${big || pub ? '' : 'obs'} ${pub ? 'pub' : ''} ${p.confidence === '하' ? 'low' : ''} ${spClass(p.species)}" style="width:${s}px;height:${s}px"></div></div>`
    });
    const m = L.marker([p.lat, p.lng], { icon, title: p.name, zIndexOffset: p.recent ? 900 : big ? 500 : pub ? 300 : 0 });
    m.bindPopup(popupHtml(p), {
      maxWidth: 280,
      // 데스크톱의 왼쪽 목록 패널이 팝업 내용을 가리지 않도록 이동한다.
      autoPanPaddingTopLeft: [window.matchMedia('(min-width: 641px)').matches ? 354 : 12, 12],
      autoPanPaddingBottomRight: [12, 12],
    });
    m._p = p;
    return m;
  });

  const state = { species: new Set(['금목서', '은목서', '목서']), kind: new Set(['명소', '공공데이터', '관측기록']), hideLow: false, recentOnly: false };
  const visible = p => speciesTags(p.species).some(s => state.species.has(s)) && state.kind.has(p.kind)
    && !(state.hideLow && p.confidence === '하') && !(state.recentOnly && !p.recent);

  function render() {
    cluster.clearLayers();
    const shown = markers.filter(m => visible(m._p));
    cluster.addLayers(shown);
    const nRecent = shown.filter(m => m._p.recent).length;
    document.getElementById('shown').textContent = `지도에 ${shown.length}곳이 보여요` + (nRecent ? ` · 최근 7일 안에 핀 곳 ${nRecent}곳` : '');
    const list = document.getElementById('list');
    const spots = shown.filter(m => m._p.kind !== '관측기록').sort((a, b) => (a._p.address || '').localeCompare(b._p.address || '', 'ko'));
    list.innerHTML = spots.map((m, i) => `<li data-i="${markers.indexOf(m)}">${esc(m._p.name)} <span class="badge ${m._p.species === '금목서' ? 'gold' : m._p.species === '은목서' ? 'silver' : ''}">${esc(m._p.species)}</span>${m._p.historical ? '<span class="badge">과거 관찰</span>' : ''}<small>${esc(m._p.address)}</small></li>`).join('')
      || '<li>보이는 장소가 없어요.</li>';
  }

  function bindChips(id, key) {
    document.querySelectorAll(`#${id} .chip`).forEach(b => b.addEventListener('click', () => {
      const on = b.getAttribute('aria-pressed') !== 'true';
      b.setAttribute('aria-pressed', on);
      on ? state[key].add(b.dataset.v) : state[key].delete(b.dataset.v);
      render();
    }));
  }
  bindChips('f-species', 'species');
  bindChips('f-kind', 'kind');
  document.getElementById('f-recent').addEventListener('click', e => {
    state.recentOnly = !state.recentOnly; e.currentTarget.setAttribute('aria-pressed', state.recentOnly); render();
  });
  document.getElementById('f-low').addEventListener('click', e => {
    state.hideLow = !state.hideLow; e.currentTarget.setAttribute('aria-pressed', state.hideLow); render();
  });

  document.getElementById('list').addEventListener('click', e => {
    const li = e.target.closest('li[data-i]'); if (!li) return;
    const m = markers[+li.dataset.i];
    cluster.zoomToShowLayer(m, () => m.openPopup());
    if (window.matchMedia('(max-width: 640px)').matches) setCollapsed(true);
  });

  const panel = document.getElementById('panel'), toggle = document.getElementById('toggle');
  function setCollapsed(c) { panel.classList.toggle('collapsed', c); toggle.textContent = c ? '펼치기' : '접기'; toggle.setAttribute('aria-expanded', !c); }
  toggle.addEventListener('click', () => setCollapsed(!panel.classList.contains('collapsed')));

  let meMarker = null;
  document.getElementById('locate').addEventListener('click', () => {
    if (!navigator.geolocation) { alert('이 브라우저에서는 위치를 쓸 수 없어요.'); return; }
    navigator.geolocation.getCurrentPosition(pos => {
      const ll = [pos.coords.latitude, pos.coords.longitude];
      if (meMarker) meMarker.remove();
      meMarker = L.circleMarker(ll, { radius: 8, color: '#1a73e8', fillColor: '#1a73e8', fillOpacity: .9, weight: 3 }).addTo(map).bindTooltip('내 위치');
      map.setView(ll, 12);
    }, err => alert('위치를 가져오지 못했어요. 휴대폰 설정에서 위치 권한을 확인해 주세요.'), { enableHighAccuracy: true, timeout: 10000 });
  });

  if (META.built) {
    const [y, mo, d] = META.built.split('-').map(Number);
    document.getElementById('built').textContent = `${y}년 ${mo}월 ${d}일 기준이에요.`;
  }
  if (window.matchMedia('(max-width: 640px)').matches) setCollapsed(true);
  render();
})();
</script>
</body>
</html>
